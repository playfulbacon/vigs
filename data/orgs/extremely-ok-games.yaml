summary: Maddy Thorson's company, incorporated in November 2012 as Matt Makes Games, later renamed Maddy Makes Games, and continued from September 2019 as Extremely OK Games in new Vancouver offices. It made TowerFall, Celeste and Celeste 64; Earthblade was cancelled in January 2025.
current: Active, run by Thorson and Noel Berry; publishing Berry's City of None, due 2027 (as of November 2026).
