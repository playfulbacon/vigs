summary: >-
  Founder and composer of the Vancouver audio studio A Shell in the Pit, which grew out of his work on
  Rogue Legacy (2013).
bio: >-
  McGladdery started in games on Rogue Legacy (2013). The Georgia Straight says he has made game sound
  since 2012 and calls him studio director; the studio's press page says A Shell in the Pit formed in
  2014 and "grew out of" his Rogue Legacy work. He did audio on Fantastic Contraption VR (2016). The studio
  is credited on Night in the Woods, Wandersong, Chicory, Ikenfell and Beastieball, and launched its own
  game, Fish Game, in 2023. Of the scene he told the Straight: "It was a high density of really talented
  people working together."
