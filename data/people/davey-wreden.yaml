summary: >-
  Creator of The Stanley Parable who moved to Vancouver in 2019 and co-founded Ivy Road (Wanderstop, 2025).
bio: >-
  Wreden, an American developer known for The Stanley Parable (2013) and The Beginner's Guide (2015),
  first visited Vancouver in 2015, staying with Colin and Sarah Northway, and moved there in 2019. He
  co-founded Ivy Road with Karla Zimonja; its Wanderstop, made with C418 and published by Annapurna, came
  out on March 11, 2025. Ivy Road's location is disputed (Vancouver or Austin), and per Wikipedia it shut
  down on March 31, 2026.
