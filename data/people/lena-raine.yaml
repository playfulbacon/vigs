bio: >-
  Raine composed the music for Celeste (2018), Chicory: A Colorful Tale (2021) and Beastieball, and was
  part of Extremely OK Games' founding team in 2019. Before Celeste she spent about six years at ArenaNet.
  She has also worked on Minecraft and Deltarune.
