notes: The full release is verified (Georgia Straight); sales, awards, ports and the Kickstarter rest on Wikipedia. EGM says PUA negotiated a royalty deal, voiced many enemies and consulted on narration and playtesting; No individual PUA staff credit is stated. Narrated by Wayne June (no person record).
