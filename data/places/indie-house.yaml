notes: 'Private home: located only to "near Steveston, Richmond"; no address is recorded. 2014 sources
  (PlayStation Blog, CGM, Polygon via Game Developer) just say "Vancouver." Games tied to it include TowerFall,
  Celeste, Night in the Woods (through Holowka), Skytorn and Ikenfell. Open questions: address, move-in
  and move-out dates, the seven residents at the peak, and why it ended.'
