<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vancouver Indie Games Story</title>
<meta name="description" content="A working timeline of the Vancouver indie game scene, the foundation for an oral history in progress.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="tabs wrap" role="tablist" id="tabs"></nav>

<main>
  <section id="view-timeline" class="view">
    <div class="controls wrap">
      <label class="search">
        <span class="visually-hidden">Follow a person, game, studio or place</span>
        <input id="search" type="search" list="entities" placeholder="Follow a person, game, studio or place…" autocomplete="off">
        <datalist id="entities"></datalist>
      </label>
      <div class="zoom">
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <button id="zoom-in" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div class="controls wrap">
      <div class="lane-toggles" id="lane-toggles" aria-label="Show categories"></div>
    </div>
    <div class="controls wrap">
      <div class="filters">
        <label><input type="checkbox" data-filter="status" value="verified" checked> Verified</label>
        <label><input type="checkbox" data-filter="status" value="single-source" checked> Single source</label>
        <label><input type="checkbox" data-filter="status" value="disputed" checked> Disputed</label>
        <label><input type="checkbox" data-filter="status" value="unverified" checked> Unverified</label>
        <select id="region" aria-label="Region">
          <option value="all">All regions</option>
          <option value="vancouver">Vancouver &amp; Lower Mainland</option>
          <option value="island">Victoria &amp; Vancouver Island</option>
        </select>
        <select id="significance" aria-label="Significance">
          <option value="1">All events</option>
          <option value="2">Notable and up</option>
          <option value="3">Turning points only</option>
        </select>
      </div>
    </div>
    <div class="focus-bar wrap" id="focus-bar" hidden></div>
    <div class="timeline-scroll" id="timeline-scroll">
      <svg id="timeline" role="img" aria-label="Timeline of events"></svg>
    </div>
    <div class="legend wrap" id="legend"></div>
  </section>

  <section id="view-list" class="view wrap" hidden>
    <div class="list-head">
      <input id="list-filter" type="search" placeholder="Filter…" autocomplete="off" aria-label="Filter this list">
      <span class="count" id="list-count"></span>
    </div>
    <div class="table-scroll"><table class="list"><thead id="list-head"></thead><tbody id="list-body"></tbody></table></div>
  </section>

  <section id="view-questions" class="view wrap" hidden>
    <div id="questions"></div>
  </section>
</main>

<aside class="panel" id="panel" hidden aria-live="polite">
  <button class="close" id="panel-close" aria-label="Close">×</button>
  <div id="panel-body"></div>
</aside>
<script src="app.js"></script>
</body>
</html>
