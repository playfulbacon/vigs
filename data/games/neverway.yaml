summary: A life-sim from Coldblood Inc., founded by Pedro Medeiros and Isadora Sophia, backed by Outersloth and scored by Disasterpeace. A free prologue came out and an October 2026 window was announced in April 2026; the Steam page now lists a planned 2027 release.
