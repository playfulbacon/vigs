summary: >-
  Former AAA programmer turned low-profile Vancouver solo developer of Enviro-Bear 2000 (2009), Desert Golfing (2014) and Horsey Game
  (2026).
bio: >-
  By his own account, Smith started at BioWare around 1999, spent about six years at Digital Extremes in
  London, Ontario, and moved to Vancouver in 2007 to join Deep Fried Entertainment, a new studio founded by
  a friend from BioWare, making indie games at home on the side. Smith made Enviro-Bear 2000 for the TIGSource Cockpit Competition, drawing the art in MS Paint, and
  released it on Game Jolt on April 4, 2009; it won the most user votes and became a 2010 IGF Nuovo Award
  finalist. Desert Golfing, which he designed, came out under Blinkbat Games on August 6, 2014. He was
  operating as Captain Games by July 2020, releasing Golf on Mars and, on February 18, 2026, Horsey Game,
  rated Overwhelmingly Positive on Steam. In 2009 he invited Chevy Ray Johnston down from Kamloops to port
  Johnston's Skullpogo to iPhone; Johnston soon moved to Vancouver and brought Maddy Thorson, the start of
  the line that led to Indie House. Smith was at the first indie meetup in May 2010 and visited Indie House
  often but did not live there.
