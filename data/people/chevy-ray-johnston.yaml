bio: >-
  Johnston was a prominent TIGSource developer in Kamloops and the maker of FlashPunk, the ActionScript
  library widely used by Flash developers. According to Justin Smith, Johnston came to Vancouver for a
  weekend in 2009 to port Skullpogo to iPhone with him, then moved to the city a few months later for a
  Flash job, rooming with Smith for about four months. Johnston brought Maddy Thorson, then in Alberta, to
  Vancouver. Johnston shared a Vancouver apartment with Maddy Thorson after her college years and suggested getting
  the house near Steveston that became Indie House, which the two took around October 2012. At the June
  2012 Full Indie Game Jam, Johnston and Noel Berry met Kevin Regamey of Power Up Audio. Johnston was
  lead developer, artist and writer of Ikenfell, released by Happy Ray Games with Humble Games on October
  8, 2020; the Georgia Straight says it came out of Indie House.
