summary: >-
  Ex-Relic developer who moved from Vancouver to the Comox Valley in 2013 and founded Hinterland Studio
  (The Long Dark).
bio: >-
  Van Lierop, formerly of Relic, moved from Vancouver to the Comox Valley around September–October 2013
  and formed Hinterland Studio as a mostly remote team. The Long Dark was announced and Kickstarted with
  Canada Media Fund seed money, entered Early Access in 2014 and was fully released in 2017. Hinterland
  announced Blackfrost: The Long Dark 2 at The Game Awards 2024.
