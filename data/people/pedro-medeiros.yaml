summary: >-
  Brazilian pixel artist who co-founded MiniBoss and Extremely OK Games, did art on TowerFall and Celeste,
  and left EXOK in November 2024 to co-run Coldblood Inc.
bio: >-
  Medeiros co-founded MiniBoss in São Paulo in 2010 with Amora Bettany and Heidy Motta, and did pixel
  art for TowerFall and Celeste. He was on the founding team of Extremely OK Games in 2019 and left in
  November 2024. Accounts of the January 2025 Earthblade cancellation differ: Shacknews says the conflict
  centred on a disagreement over Celeste's IP rights between Thorson and Berry and Medeiros, who "reached
  a resolution"; Engadget says the split was amicable and "not the reason," quoting Thorson that "Pedro
  and the Neverway team aren't the enemy." He co-founded Coldblood Inc. with Isadora Sophia; its Neverway,
  backed by Outersloth, now lists a 2027 release.
