summary: Former Riot developer who co-founded Phoenix Labs in April 2014.
bio: >-
  Sean Bender co-founded Phoenix Labs in April 2014 with fellow ex-Riot developers Jesse Houston and Robin
  Mayne. The studio made Dauntless and Fae Farm, was acquired by Garena in January 2020 and laid off most
  of its remaining staff in January 2025.
