caveat: Both accounts are oral. They agree on the cold email and the port but differ on how long the visit lasted.
  Johnston says the visit came first.
open_questions:
- Johnston remembers going to the indie meetup during this visit, but the port is dated October 2009 (TouchArcade
  snippet) and the first documented meetup is May 2010. Was the visit later, or was the meetup on a later trip?
