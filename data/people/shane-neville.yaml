summary: Vancouver developer of Bunker Punks (Ninja Robot Dinosaur) and an early Full Indie regular.
bio: Neville makes games as Ninja Robot Dinosaur. Bunker Punks, a lo-res roguelike FPS inspired by Canadian politics,
  went on preorder in April 2015, entered Early Access on March 30, 2016 and was released on May 28, 2018. Justin
  Smith remembers him at the first Vancouver indie meetup in May 2010, and the long project as one the scene rooted
  for.
