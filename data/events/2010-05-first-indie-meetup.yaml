id: 2010-05-first-indie-meetup
title: First Vancouver Indie Game Developers meetup at Soho Cafe and Billiards
date:
  value: "2010-05"
  note: Meetup.com group set up by May 10; Birkett's write-up of the first meeting is dated May 22. The exact meeting
    date is unknown.
era: first-indies
type: meetup
summary: Jake Birkett and Alex Vostrov (Rocket Bear Games, formerly Indiebird) hold the first Vancouver Indie Game
  Developers meetup at Soho Cafe and Billiards in Yaletown, with 40+ attendees from a group of 60+ members. The
  meetup becomes Full Indie.
