summary: >-
  Vancouver solo developer (Rocket Bear Games, Infested Planet) who co-founded Full Indie in 2010 and
  was its president until 2016.
bio: >-
  Vostrov runs the one-person studio Rocket Bear Games, formerly Indiebird; Infested Planet was its first
  commercial game. He answered Jake Birkett's April 24, 2010 meetup proposal the same day and co-founded
  the Vancouver Indie Game Developers meetup, which became Full Indie. Game Developer profiled him on
  July 19, 2010 as he went full-time indie. He was Full Indie's president from 2010 until 2016, when Maurice
  Grela took over.
