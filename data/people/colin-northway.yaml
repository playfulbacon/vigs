summary: >-
  Designer of the physics puzzlers Fantastic Contraption (2008) and Incredipede (2012), co-founder of
  Northway Games, and a Vancouver resident since 2014.
bio: >-
  Northway began making games with Sarah Northway at the University of Victoria. He made the Flash game
  Fantastic Contraption (September 16, 2008) on the side while building websites for lawyers; it drew
  more than 3.5 million unique users in about three months, and he sold the rights to inXile. The couple
  then travelled for about five years, during which he made Incredipede (October 25, 2012) with Sarah
  and artist Thomas Shahan. They settled in Vancouver in 2014. His other games include Deep Under the
  Sky and Fantastic Contraption VR (2016). In the Georgia Straight he said: "Indie House is huge in the
  history."
