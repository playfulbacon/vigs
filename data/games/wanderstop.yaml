vancouver_connection: Disputed. MobileSyrup calls Ivy Road a team "led by Davey Wreden and Karla Zimonja in Vancouver," and Wreden has lived in Vancouver since 2019; Wikipedia cites C418 describing a studio "based in Austin, Texas."
summary: A game by Ivy Road (Davey Wreden, Karla Zimonja and C418), with concept art by Amora Bettany, published by Annapurna on March 11, 2025. Ivy Road shut down on March 31, 2026, per Wikipedia.
