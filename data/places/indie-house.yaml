summary: A shared house near Steveston, Richmond, filled with indie developers from about October 2012
  to late 2016, taken at Chevy Ray Johnston's suggestion. Documented residents are Maddy Thorson, Chevy
  Ray Johnston, Alec Holowka, Noel Berry and, from 2015, Greg Lobanov; at one point four of its seven
  residents were working on TowerFall.
