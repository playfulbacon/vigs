summary: >-
  Lead creator of TowerFall (2013) and Celeste (2018), an Indie House resident, and founder of the studio
  now called Extremely OK Games.
bio: >-
  Thorson studied at Grande Prairie Regional College in Alberta and then moved into a Vancouver apartment
  with Chevy Ray Johnston. TowerFall began as a Flash prototype at the June 2012 Full Indie Game Jam,
  from her visit with Alec Holowka there. Around October 2012 she and Johnston took the house near Steveston
  that became Indie House. She incorporated Matt Makes Games Inc. in November 2012 (later Maddy Makes
  Games). TowerFall launched as an Ouya exclusive on June 25, 2013 and as TowerFall Ascension in March
  2014, grossing $500K by April 2014; she was named to the Forbes 30 Under 30 that year. Celeste, made
  with Noel Berry and others, followed on January 25, 2018. On September 5, 2019 she announced the studio
  would continue as Extremely OK Games. EXOK cancelled Earthblade in January 2025; she and Berry made
  the decision in December 2024, and published accounts differ on how much a dispute over Celeste's IP
  with Pedro Medeiros contributed. She released the Super Mario World romhack Masterpiece in 2025.
