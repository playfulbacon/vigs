  note: Sarah Northway's account of a Victoria meetup that a former roommate "brought with him"
- source: 2026-11-11-justin-smith
  note: Smith attended; he names Nels Anderson, Brian Provinciano, Shane Neville, Michael Labbe and Graham Jans
    among the others and recalls about 25 people at a billiard club in Gastown
caveat: 'Victoria roots are unresolved: Sarah Northway says a former Victoria roommate "started a meet-up in Victoria
  for indie devs" and "brought it with him," but Jake Birkett''s accounts do not mention Victoria. See the Victoria
  sidebar. Attendance and place: Justin Smith remembers about 25 people at a billiard club in Gastown; Birkett''s
  contemporaneous write-up says 40+ at Soho Cafe and Billiards in Yaletown.'
open_questions:
- Who was the Victoria roommate who started an indie meetup and 'brought it with him'? When and where did the Victoria
  meetup run? (Ask Sarah and Colin Northway and Alex Vostrov.)
- What was the date of the first meetup at Soho Cafe and Billiards? (Ask Jake Birkett, Alex Vostrov, Su Skerl and
  Jason Elliot.)
- Who was there? Justin Smith has an attendee list and offered to send it; Michael Labbe photographed early meetups.
