summary: >-
  Pittsburgh-based co-creator of Night in the Woods (2017) with Alec Holowka and Bethany Hockenberry.
bio: >-
  Benson was animator, designer, artist and lead writer on Night in the Woods, which Infinite Fall Kickstarted
  in October 2013 and released on February 21, 2017; it won the IGF 2018 Seumas McNally Grand Prize and
  a BAFTA for Narrative. In August 2019, after Zoë Quinn's allegations against Holowka, he wrote, "We
  take such allegations seriously as a team." His later studio, The Glory Society, closed in November
  2023 after his heart-disease diagnosis.
