vancouver_connection: Not a Vancouver release as such. The Northways began at the University of Victoria and then travelled for about five years, settling in Vancouver only in 2014; where Colin lived in 2008 is undocumented.
summary: Colin Northway's Flash physics-construction game, made on the side while he built websites for lawyers. It drew more than 3.5 million unique users in about three months, and he sold the rights to inXile, which released an iOS version in January 2009.
