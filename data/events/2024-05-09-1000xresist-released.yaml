summary: 1000xRESIST by Sunset Visitor, a four-person Vancouver team led by Remy Siu and Kodai Yanagawa and published
  by Fellow Traveller, is released. It wins a 2024 Peabody Award (Interactive & Immersive) and is an IGF Grand Prize
  nominee; PS5 and Xbox versions follow on November 4, 2025, and Switch 2 on August 20, 2026.
