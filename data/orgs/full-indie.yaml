summary: Vancouver nonprofit that grew from the Vancouver Indie Game Developers meetup Jake Birkett and Alex Vostrov started in 2010, first held at Soho Cafe and Billiards. It runs monthly meetups, a game jam (from 2011) and the Full Indie Summit (from 2013), and is the scene's main organizing body.
current: 'Active; meetups resumed after the Covid hiatus and the Summit has run annually again since 2024. Presidents: Alex Vostrov (2010–2016), Maurice Grela (2016 to about 2023), Aryo Nazaradeh, and Chloe Ezra (listed as president as of November 2026).'
