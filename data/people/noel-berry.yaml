summary: >-
  Indie House resident, co-creator of Celeste Classic and lead programmer of Celeste, who now co-leads
  Extremely OK Games.
bio: >-
  Berry met Kevin Regamey of Power Up Audio at the June 2012 Full Indie Game Jam. Living at Indie House,
  he announced Skytorn for PS4 on December 6, 2014, made "alongside the developers of TowerFall Ascension
  and Night in the Woods." In August 2015 he and Maddy Thorson made the PICO-8 Celeste in a four-day jam,
  and he was lead programmer on Celeste (2018). Skytorn, paused for Celeste, was cancelled in late December
  2018. He was on the founding team of Extremely OK Games in 2019, and with Thorson decided in December
  2024 to cancel Earthblade. On April 30, 2026 he revealed City of None, a metroidvania made with his
  brother Liam Berry and published by EXOK, for 2027.
