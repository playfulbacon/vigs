summary: >-
  UK developer who proposed and co-founded the 2010 Vancouver meetup that became Full Indie, then left
  Vancouver in 2012.
bio: >-
  Birkett came to Vancouver from the UK to work at Big Fish Games, where he spent about two years. On
  April 24, 2010 he proposed a monthly indie meetup on his Grey Alien Games blog, and Alex Vostrov answered
  the same day. The first meeting, at Soho Cafe and Billiards in Yaletown, drew 40+ attendees from 60+
  members, and Birkett wrote it up on May 22, 2010. By November 30, 2012 he reported Full Indie had "well
  over 1000 members." He left Vancouver in 2012, the year the UK branch FullIndie.uk started. He runs
  Grey Alien Games (Regency Solitaire, Shadowhand, Ancient Enemy).
