summary: >-
  Founder of Brace Yourself Games (Vancouver, 2013) and director of Crypt of the NecroDancer and Cadence
  of Hyrule.
bio: >-
  Clark founded Brace Yourself Games in Vancouver in 2013. Crypt of the NecroDancer, his game with music
  by Danny Baranowsky, entered Early Access on July 30, 2014 and had its full release, published by Klei,
  on April 23, 2015. He directed Cadence of Hyrule (Nintendo, June 13, 2019). The studio later released
  Phantom Brigade and Rift of the NecroDancer (2025), launched a publishing label in 2022 and laid off
  about half its staff in May 2023.
