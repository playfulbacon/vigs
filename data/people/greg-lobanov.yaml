summary: >-
  Philadelphia-born developer of Wandersong, Chicory and Beastieball who moved into Indie House in 2015
  and now co-organizes Vancouver Game Garden.
bio: >-
  Lobanov was born and raised in Philadelphia, graduated from Drexel and worked as Dumb and Fat Games.
  A May 2015 exit interview called him a "22-year-old game developer… leaving for Vancouver"; that year
  he moved into the Richmond house. He released Wandersong in 2018 and Chicory: A Colorful Tale on June
  10, 2021, which won a BAFTA and which he calls his biggest success. His studio Wishes Unlimited's Beastieball
  entered Early Access on November 12, 2024, published by Klei. He co-organizes Vancouver Game Garden,
  first held in 2024, and leads a developer volleyball team. He told the Georgia Straight: "Vancouver
  might be the biggest indie game city on the planet."
