summary: Founded in September 1991 by Rory Armes (ex-DSI), Dave Davis and Ian Wilkinson, first based in Yaletown. Ex-Radical staff founded Barking Dog, Black Box and Hothead, which makes it the second great trunk of the family tree.
current: Cut to a support studio after Activision's June 28, 2012 staff reduction; later status not researched (as of November 2026).
