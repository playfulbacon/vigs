summary: Full Indie's annual conference, first held April 20, 2013 at the Rio Theatre to fill the gap left by GDC Canada. It paused during Covid and returned in 2024, at Emily Carr (2024), the Vancouver Playhouse (2025) and the Westin Bayshore (2026).
current: Annual again since 2024; the September 20, 2026 edition had 1,351 RSVPs on Luma (an RSVP count, not audited attendance) (as of November 2026).
