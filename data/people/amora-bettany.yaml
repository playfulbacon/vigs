summary: >-
  Brazilian artist and MiniBoss co-founder whose credits include TowerFall, Celeste and Celeste 64; she
  moved to Vancouver in 2019.
bio: >-
  Bettany co-founded MiniBoss in São Paulo in 2010 with Pedro Medeiros and Heidy Motta; the studio later
  did art for TowerFall and Celeste. Her credits include character design and concept art on TowerFall,
  writing, concept art and animation on Celeste (2018), co-creating Celeste 64: Fragments of the Mountain
  (2024) and concept art for Wanderstop (2025). She was on the founding team of Extremely OK Games and
  moved to Vancouver in 2019 to work there in person. Per Wikipedia she left EXOK around the dispute over
  Celeste's IP.
