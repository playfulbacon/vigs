summary: Industry conference held twice at the Vancouver Convention Centre, in 2009 (800+ attendees, produced by Think Services and Reboot Communications) and May 6–7, 2010. Its end left the gap the Full Indie Summit was created to fill.
current: The Straight reported on May 10, 2011 that it "seems to be finished," replaced by the Canadian Games Conference.
