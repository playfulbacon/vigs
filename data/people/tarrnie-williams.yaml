id: tarrnie-williams
name: Tarrnie Williams
summary: Helped Distinctive Software's founders license their first game, Evolution, in 1982.
bio: >-
  The Georgia Straight's 2009 family tree says Don Mattrick and Jeff Sember founded Distinctive Software
  with help from Tarrnie Williams, who helped license their first game, Evolution. Nothing further was
  found.
consent:
  status: not-asked
status: verified
