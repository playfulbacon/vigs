summary: >-
  Chevy Ray Johnston confirms coming to Vancouver after Justin Smith cold-emailed about porting Skullpogo,
  building the port in Smith's kitchen, meeting the indie meetup crowd and moving to the city. Johnston
  traces the Indie House group to the Game Maker forums and TIGSource, where Johnston knew Maddy Thorson
  from about age 16 and Noel Berry as FlashPunk's most helpful community member, and describes pitching
  Vancouver to both until they visited and moved, then proposing the shared house. Johnston also
  introduced Pedro Medeiros and Amora Bettany to Thorson for TowerFall. The interview traces how a
  freeware scene turned into an industry (Flash sponsorships, Adult Swim, incorporating, Steam, then
  consoles) and ends on indie's future as many small "planets" after a big bang.
