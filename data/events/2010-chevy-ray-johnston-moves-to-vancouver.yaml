summary: After the Skullpogo trip, Johnston moves to Vancouver, already with about 15 friends from the indie meetup,
  and rooms with Justin Smith for about four months. After about a year Johnston begins inviting Maddy Thorson and
  Noel Berry from the Prairies to visit; both move here, the start of Indie House in 2012.
