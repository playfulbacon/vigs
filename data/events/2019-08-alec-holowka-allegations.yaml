summary: According to Wikipedia, Zoë Quinn publicly accused Alec Holowka of physical and emotional abuse
  in August 2019, and the next day the Night in the Woods team cut ties with him. Scott Benson wrote,
  "We take such allegations seriously as a team," and said corroborating evidence had been presented to
  them; Finji backed the decision.
