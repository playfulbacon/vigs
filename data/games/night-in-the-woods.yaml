notes: >-
  Made_at indie-house carries a caveat: the tie runs through Holowka, and no source names which parts were made there. A YouTube video titled "Indie House / Night In The Woods" appeared in October 2013 (cited on Wikipedia). A Shell in the Pit lists the game among its credits; its exact role (likely sound design, since Wikipedia credits the music to Holowka and Benson) is unverified. Co-developer Secret Lab has no org record.
  In August 2019, per Wikipedia, the team cut ties with Holowka the day after Zoe Quinn publicly accused him of abuse; Holowka died on August 31, 2019. See his person record for the attributed statements.
