summary: >-
  Full Indie president after the Covid pause, who restarted its meetups; by 2024 they ran at The Gaming
  Stadium in Richmond.
bio: >-
  Nazaradeh returned to Vancouver from Toronto in 2022. He got involved through game audio and networking,
  restarted Full Indie's meetups and became its president. By March 2024 he was running monthly meetups
  of 100+ people at The Gaming Stadium in Richmond. He told the Georgia Straight: "The people here are
  really, really passionate." As of November 2026 he is no longer listed as president.
