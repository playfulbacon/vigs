id: 2017-02-21-night-in-the-woods-released
title: Night in the Woods released
date: '2017-02-21'
era: breakout-years
type: release
summary: Night in the Woods, by Infinite Fall with Secret Lab and published by Finji, is released on PC and PS4.
  The Georgia Straight counts it among the games that came out of Indie House, a tie that runs through Alec Holowka.
  It later wins the IGF 2018 Seumas McNally Grand Prize and a BAFTA for Narrative.
