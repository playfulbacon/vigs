summary: Greg Lobanov's creature-sports RPG, revealed at Day of the Devs (Summer Game Fest) in June 2023 and Kickstarted soon after. It entered Steam Early Access on November 12, 2024 under Klei Publishing and, as of November 2026, remains in Early Access with 1.0 set for early 2027.
