summary: Hinterland's sequel to The Long Dark, announced at The Game Awards on December 12, 2024 with Early Access planned for 2026. It later slipped to 2027, and Steam lists its date as "To be announced."
status: single-source
sources: [wikipedia-the-long-dark, pcgamer-the-long-dark-will-get-new-dlc-again-as-studio-shifts-devs-awa]
notes: The slip to 2027 rests on a PC Gamer search summary. Hinterland shifted developers back to The Long Dark DLC "to survive an uncertain industry" (PC Gamer, snippet).
