notes: >-
  Disputed location (the game schema has no accounts field, so versions are recorded here).
  (1) MobileSyrup (Dec 29, 2025): Ivy Road is "a global team led by Davey Wreden and Karla Zimonja in Vancouver, B.C."
  (2) Wikipedia: cites C418 describing a studio "based in Austin, Texas"; Ivy Road closed March 31, 2026 (single-source).
  The Georgia Straight (2024) includes Wreden and Zimonja in its Vancouver story and calls Ivy Road an "international studio." Zimonja's residence is unstated. C418 has no person record.
