summary: Maddy Thorson's local-multiplayer archery game, begun as a Flash prototype at the June 2012 Full Indie Game Jam after a visit with Alec Holowka. It launched as an Ouya exclusive in June 2013, becoming the console's "killer app," and as TowerFall Ascension on PS4 and Steam in March 2014.
