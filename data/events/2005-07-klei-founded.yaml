summary: Jamie Cheng, formerly a specialist AI programmer at Relic, bootstraps Klei Entertainment, with Jeffrey
  Agala as co-founder and creative director. Klei is the clearest early case of an independent studio spun out of
  the AAA lineage, and later acts as a patron for local indies.
