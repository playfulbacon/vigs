summary: Relic Entertainment founding member who co-founded Blackbird Interactive in 2007.
bio: >-
  Kambeitz was one of Relic Entertainment's founders in May 1997 and worked on Homeworld. In 2007 he co-founded
  Blackbird Interactive with Rob Cunningham and other ex-Relic and ex-EA staff; Wikipedia lists him as
  chief creative officer.
