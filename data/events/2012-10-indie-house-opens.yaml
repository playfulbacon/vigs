summary: Maddy Thorson and Chevy Ray Johnston take "a literal house near Steveston" in Richmond, at Johnston's suggestion,
  and fill it with indie developers. Documented residents include Thorson, Johnston, Alec Holowka, Noel Berry and,
  from 2015, Greg Lobanov; at one point four of its seven residents were working on TowerFall. It remains the scene's
  physical centre until late 2016.
