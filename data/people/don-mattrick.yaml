summary: >-
  Co-founder of Distinctive Software (1982), the studio EA bought in 1991 to form EA Canada, and later
  a senior executive at EA, Microsoft (Xbox) and Zynga.
bio: >-
  Mattrick studied at Simon Fraser University and co-founded Distinctive Software Inc. (DSI) with Jeff
  Sember in 1982, at age 17, with Tarrnie Williams helping to license their first game, Evolution. Sember
  sold his stake to him in 1986. EA bought DSI in 1991 and it became EA Canada (later EA Vancouver). Mattrick
  went on to be president of EA Worldwide Studios, head of Xbox at Microsoft (2007–2013) and CEO of Zynga
  (2013–2015).
