summary: Coldblood Inc., which Gematsu describes as "an independent Vancouver studio" founded by Pedro Medeiros
  and Isadora Sophia, releases a free prologue for Neverway and announces an October 2026 release window. The game
  is backed by Outersloth and scored by Disasterpeace.
