summary: >-
  Former Relic AI programmer who bootstrapped Klei Entertainment in July 2005; under him Klei has also
  published Vancouver peers.
bio: >-
  Cheng studied computer science at Simon Fraser University and spent nearly three years as an AI programmer
  at Relic Entertainment. He left to bootstrap Klei Entertainment in July 2005; Wikipedia adds that he
  funded it by selling his THQ shares and borrowing $10,000 from his brother. Klei's games include Shank,
  Mark of the Ninja, Don't Starve, Oxygen Not Included, Griftlands and Rotwood, and it published Crypt
  of the NecroDancer, Rift of the NecroDancer and Beastieball. When Tencent took a majority stake in January
  2021, Cheng said Klei would keep full autonomy.
