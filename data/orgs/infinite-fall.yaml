notes: 'Holowka is documented as a co-founder; the report lists Benson and Hockenberry as the team without stating founder roles. In August 2019 Zoë Quinn publicly accused Holowka of abuse and the Night in the Woods team cut ties with him the next day (Wikipedia: Alec Holowka); he died on August 31, 2019. Handle with care and attribution.'
