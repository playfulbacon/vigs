summary: Developer of Pony Island (2016) and Inscryption (2021), Vancouver-based by 2020.
bio: >-
  Mullins released Pony Island on January 4, 2016; it began as a December 2014 Ludum Dare prototype, with
  music by Jonah Senzel. After The Hex (2018), Inscryption, which grew from his Ludum Dare 43 game Sacrifices
  Must Be Made, was released by Devolver Digital on October 19, 2021. It sold more than 1 million copies
  by January 2022 and won the IGF Seumas McNally Grand Prize and GDCA Game of the Year in March 2022.
  He announced Pony Island 2: Panda Circus at The Game Awards on December 7, 2023; it is dated April 27,
  2027.
