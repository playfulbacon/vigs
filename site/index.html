<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vancouver Indie Games Story</title>
<meta name="description" content="A working timeline of the Vancouver indie game scene, the foundation for an oral history in progress.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="page topbar">
  <label class="search">
    <span class="visually-hidden">Search people, games, studios, places and events</span>
    <input id="search" type="search" list="entities" placeholder="Search people, games, studios, places, events…" autocomplete="off">
    <datalist id="entities"></datalist>
  </label>
  <div class="focus-bar" id="focus-bar" hidden></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>

<div class="page layout">
<main>
  <section id="view-timeline" class="view">
    <div class="controls">
      <div class="lane-toggles" id="lane-toggles" aria-label="Show or hide events"></div>
    </div>
    <div class="controls zoom-row">
      <div class="seg" role="group" aria-label="Timeline layout">
        <button data-orient="vertical" aria-pressed="true">Vertical</button>
        <button data-orient="horizontal" aria-pressed="false">Horizontal</button>
      </div>
      <div class="zoom">
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <button id="zoom-in" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="card timeline-card" id="timeline-card">
      <div class="timeline-scroll" id="timeline-scroll">
        <svg id="timeline" role="img" aria-label="Timeline of events"></svg>
      </div>
    </div>
    <div class="card vtimeline" id="vtimeline" hidden></div>
  </section>

  <section id="view-list" class="view" hidden>
    <div class="list-head">
      <span class="count" id="list-count"></span>
    </div>
    <div class="card table-scroll"><table class="list"><thead id="list-head"></thead><tbody id="list-body"></tbody></table></div>
  </section>

  <section id="view-questions" class="view" hidden>
    <div id="questions"></div>
  </section>
</main>

<aside class="card panel" id="panel" aria-live="polite">
  <button class="close" id="panel-close" aria-label="Close">×</button>
  <div id="panel-body"></div>
</aside>
</div>
<script src="app.js"></script>
</body>
</html>
