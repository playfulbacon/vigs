id: aaa-roots
title: The AAA roots and first spin-offs
start: "1982"
end: "2007"
order: 1
summary: >
  Distinctive Software becomes EA Canada, and a family tree of studios (Radical, Relic,
  Barking Dog, Black Box, Next Level) spins out of it. Klei (2005) is the first
  bootstrapped independent from that lineage.
