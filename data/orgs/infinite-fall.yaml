summary: The Night in the Woods team of Alec Holowka, Scott Benson and Bethany Hockenberry; it developed the game with Secret Lab, and Finji published it on February 21, 2017. Its tie to Vancouver runs through Holowka's time at Indie House; Benson and Hockenberry were based in Pittsburgh.
current: Not documented after 2019.
