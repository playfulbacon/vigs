id: 2013-04-full-indie-summit
title: First Full Indie Summit at the Rio Theatre
date: "2013-04-20"
era: indie-house-era
type: conference
summary: The first Full Indie Summit is held at the Rio Theatre, conceived by Brian Provinciano and organized with
  Full Indie, with speakers including Nels Anderson, Jake Kazdal, Adam Boyes (Sony) and Dan Adelman (Nintendo).
  It fills the gap left by GDC Canada (2009–2010) and the AAA studio closures. It reportedly sold out at about 400
  attendees.
