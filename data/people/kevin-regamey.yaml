summary: >-
  Power Up Audio co-founder and sound designer of Celeste, whose audio won Best Audio at the 2019 Game
  Developers Choice Awards.
bio: >-
  Regamey co-founded Power Up Audio with Jeff Tangsoc after they met at a large commercial sound studio,
  which he called "a lifestyle of distrust." At the June 2012 Full Indie Game Jam he met Noel Berry and
  Chevy Ray Johnston, and the TowerFall team later invited Power Up Audio to Indie House; its TowerFall
  sound work started at the January 2013 Global Game Jam. The studio went on to NecroDancer and Darkest
  Dungeon. Regamey did the sound design for Celeste (2018), which won Best Audio at the 2019 GDC Awards,
  and in early 2020 Power Up Audio released Celeste's FMOD project and source audio.
