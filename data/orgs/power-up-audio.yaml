summary: Audio studio founded by Kevin Regamey and Jeff Tangsoc whose route into games ran from the 2012 Full Indie Game Jam to Indie House to TowerFall, then to Crypt of the NecroDancer, Darkest Dungeon and Celeste. It is one of two local audio houses linking most of the scene's hits.
