summary: >-
  MiniBoss co-founder and Extremely OK Games operations manager whose tweet supplied the studio's name.
bio: >-
  Motta co-founded MiniBoss in São Paulo in 2010 with Amora Bettany and Pedro Medeiros. She was on the
  founding team of Extremely OK Games in 2019 as operations manager, and a tweet of hers supplied the
  name "Extremely OK Games."
