notes: 'Venues: Rio Theatre (2013), Stanley Theatre (2014), Vancouver Convention Centre (2015, snippet only), Vancouver Playhouse (2016), Emily Carr University (2024), Vancouver Playhouse (2025), Westin Bayshore (2026). 2017–2019 venues unknown. The 2019 edition was billed as the "8th annual" with "650+ creators each year," though annual editions from 2013 would make it the seventh. Whether 2026 was one day (Luma) or two (PocketGamer.biz) is unresolved.'
