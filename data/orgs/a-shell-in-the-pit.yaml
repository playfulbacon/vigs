notes: 'Disputed founding year. Account 1 (Georgia Straight, 2024): the company started making game sound in 2012. Account 2 (A Shell in the Pit press page): founded 2014, growing out of McGladdery''s Rogue Legacy (2013) work. Likeliest reconciliation: McGladdery worked solo from 2012 and the studio formed in 2014. Em Halberstadt is creative director, not the founder; Rachel Sim is studio director.'
