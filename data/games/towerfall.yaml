notes: Holowka stepped back from the project soon after the jam. Wikipedia credits the TowerFall sound effects to Power Up Audio; EGM says PUA's TowerFall SFX work started at the January 2013 Global Game Jam. CGM calls the IGF 2014 result a "finalist"; Wikipedia says nominee (lost to Papers, Please). Research notes (people_bios.md) also credit Holowka with music for TowerFall Ascension. MiniBoss finished the graphics.
