summary: >-
  One of six ex-Radical developers who founded Barking Dog Studios in 1998, and a key figure at Slant
  Six Games (2005).
bio: >-
  Thalken was one of the six former Radical Entertainment developers who founded Barking Dog Studios in
  May 1998; Take-Two bought it in 2002 and it became Rockstar Vancouver. He is the named key person at
  Slant Six Games, founded in 2005, which closed in 2013.
