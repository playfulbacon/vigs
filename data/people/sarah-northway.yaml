summary: >-
  Designer of the Rebuild series and I Was a Teenage Exocolonist (2022), co-founder of Northway Games,
  and a Vancouver resident since 2014.
bio: >-
  Northway began making games with Colin Northway at the University of Victoria and worked in game development
  in San Francisco before going indie. She released Rebuild and Rebuild 2 in 2011, co-designed Incredipede
  (2012) while the couple were travelling, and designed I Was a Teenage Exocolonist (August 25, 2022,
  published by Finji), which won the Canadian Screen Award for Best Video Game. On the early scene she
  told the Georgia Straight: "It was just this really small community in 2010." She recalls that a former
  Victoria roommate "started a meet-up in Victoria for indie devs" and "brought it with him" to Vancouver;
  he is not named.
