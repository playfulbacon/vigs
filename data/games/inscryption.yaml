summary: Daniel Mullins Games' card-based horror game, published by Devolver Digital on October 19, 2021. It grew from Mullins's Ludum Dare 43 game Sacrifices Must Be Made, sold over a million copies by January 2022, and won both the IGF Grand Prize and GDCA Game of the Year in March 2022.
