  note: Smith's recollection
era: first-indies
type: other
summary: After Enviro-Bear goes viral, Justin Smith cold-emails Chevy Ray Johnston, a fan of it, asking to make an
  iPhone version of Johnston's Skullpogo. Johnston, then living in a small BC Interior town, comes to Vancouver and they
  build the port in Smith's kitchen; it is released that October. Johnston
  moves to the city a few months later and brings Maddy Thorson, the start of the line that leads to Indie House.
