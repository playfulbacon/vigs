vancouver_connection: Partly tied to Indie House through Alec Holowka, who lived there; the Georgia Straight counts it among the games that came out of the house. Benson and Hockenberry were based in Pittsburgh, Holowka worked remotely from Winnipeg by the IGF period, and the game's Wikipedia page mentions neither Vancouver nor Indie House.
