summary: >-
  Vblank Entertainment developer of Retro City Rampage (2012) who conceived the first Full Indie Summit
  in 2013.
bio: >-
  Provinciano's Vblank Entertainment released Retro City Rampage on PC, PS3 and Vita on October 9, 2012.
  He came up with the idea for the Full Indie Summit and organized the first one with Full Indie at the
  Rio Theatre on April 20, 2013, filling the gap left by GDC Canada.
