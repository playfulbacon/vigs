summary: 'Founded in Burnaby in 1982 by Don Mattrick (age 17) and Jeff Sember, with Tarrnie Williams helping to license their first game, Evolution. It is the root of Vancouver''s studio family tree: EA bought it in 1991 and it became EA Canada.'
