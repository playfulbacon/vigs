summary: >-
  Winnipeg-born designer, programmer and composer who co-founded Bit Blot, Infinite Ammo and Infinite
  Fall, and whose Indie House residency ties Night in the Woods to Vancouver.
bio: >-
  Holowka co-founded Bit Blot (Aquaria, IGF Grand Prize), Infinite Ammo and Infinite Fall. Early in his
  career he worked on an Xbox 360 racer in Vancouver. TowerFall began from Maddy Thorson's visit with
  him at the June 2012 Full Indie Game Jam; he stepped back from the project soon after. He lived at Indie
  House, and Night in the Woods (Infinite Fall with Scott Benson and Bethany Hockenberry) was Kickstarted
  in October 2013 and released on February 21, 2017. In August 2019 Zoë Quinn publicly accused him of
  physical and emotional abuse; the next day the Night in the Woods team cut ties with him, with Benson
  writing that corroborating evidence had been presented to them, and Finji backed the decision. Holowka
  died in Winnipeg on August 31, 2019, four days after the allegations. His sister's statement said he
  had been "battling mood and personality disorders," "was a victim of abuse," had been seeking treatment,
  and "wished the best for Zoë and everyone else."
