notes: Name history (Matt Makes Games → Maddy Makes Games → Extremely OK Games) is recorded as aliases because the earlier names have no separate org records, so no renamed-from lineage can point at them. Matt Makes Games was Thorson's company; the six listed founders are the 2019 EXOK founding team (Thorson, Noel Berry, Amora Bettany, Pedro Medeiros, Heidy Motta, Lena Raine). Heidy Motta's tweet supplied the name (◐). EXOK spent its first six months relocating international developers to Canada (◐). Pedro Medeiros left in November 2024 after a dispute over Celeste's IP; outlets disagree on how much that dispute caused Earthblade's cancellation (see the event records).
