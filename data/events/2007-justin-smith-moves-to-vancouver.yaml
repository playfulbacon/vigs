id: 2007-justin-smith-moves-to-vancouver
title: Justin Smith moves to Vancouver from AAA in Ontario
date: "2007"
era: aaa-roots
type: move
summary: After about eight years in AAA at BioWare and Digital Extremes, Justin Smith moves to Vancouver to join Deep
  Fried Entertainment, a young studio where a friend from BioWare was a founder. He makes small indie games at home and enters
  TIGSource competitions; he later made Enviro-Bear 2000, Desert Golfing and Horsey Game here.
