notes: 'Brand designed by Su Skerl and Jason Elliot. Size: "well over 1000 members" (Nov 30, 2012); "upwards of 250 developers every month" (CGM, Dec 2014); 2,000+ members in 2014 (◐ Wikipedia); 5,000 members at its peak (Straight). A UK branch, FullIndie.uk (formerly Best of British), started in 2012 (◐). Disputed restart date: the Straight says Nazaradeh took over after returning from Toronto in 2022; Full Indie''s site says meetups resumed in 2023 "after a five-year hiatus that began during the COVID-19 pandemic." Other officers as of November 2026: Miranda (VP), Amelia Wales (Treasurer), Vivan Huang (Secretary), Demi Montes (Community Manager).'
