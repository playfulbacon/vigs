summary: >-
  Low-profile Canadian solo developer of Enviro-Bear 2000 (2009), Desert Golfing (2014) and Horsey Game
  (2026).
bio: >-
  Smith made Enviro-Bear 2000 for the TIGSource Cockpit Competition, drawing the art in MS Paint, and
  released it on Game Jolt on April 4, 2009; it won the most user votes and became a 2010 IGF Nuovo Award
  finalist. Desert Golfing, which he designed, came out under Blinkbat Games on August 6, 2014. He was
  operating as Captain Games by July 2020, releasing Golf on Mars and, on February 18, 2026, Horsey Game,
  rated Overwhelmingly Positive on Steam.
