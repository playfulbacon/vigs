notes: Wikipedia credits Kevin Regamey by name, not Power Up Audio as a company; EGM says PUA did all sound design plus some music support. PUA released the game's FMOD project and source audio in early 2020. The 1.7M figure appears in PC Gamer's Earthblade coverage, whose body could not be read. The Straight's Indie House tie is not otherwise detailed, so made_at is left empty.
