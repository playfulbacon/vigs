$schema: https://json-schema.org/draft/2020-12/schema
$id: claim.yaml
title: Claim
description: >
  One statement made by a person (in an interview) or a source, linked to what it is about.
  Claims are the atoms of the oral history; events and bios cite them.
type: object
additionalProperties: false
required: [id, text, about, review]
anyOf: [ { required: [interview] }, { required: [source] } ]
properties:
  id: { $ref: 'common.yaml#/$defs/id', description: 'Convention: <interview-id>-NNN' }
  text: { type: string, description: The claim paraphrased in one sentence. }
  quote: { type: string, description: Verbatim excerpt. Only published once review = public. }
  speaker: { $ref: 'common.yaml#/$defs/id' }
  interview: { $ref: 'common.yaml#/$defs/id' }
  timestamp: { type: string, pattern: '^\d{1,2}:\d{2}:\d{2}$' }
  source: { $ref: 'common.yaml#/$defs/id' }
  about:
    type: object
    additionalProperties: false
    properties:
      events: { $ref: 'common.yaml#/$defs/ids' }
      people: { $ref: 'common.yaml#/$defs/ids' }
      games: { $ref: 'common.yaml#/$defs/ids' }
      orgs: { $ref: 'common.yaml#/$defs/ids' }
      places: { $ref: 'common.yaml#/$defs/ids' }
      eras: { $ref: 'common.yaml#/$defs/ids' }
  date_referenced: { $ref: 'common.yaml#/$defs/date', description: When the thing described happened, if the speaker gave one. }
  stance: { enum: [supports, contradicts, adds, new] , description: Relation to the existing record. }
  kind: { enum: [fact, memory, opinion, anecdote, theme] }
  themes: { type: array, items: { type: string }, description: 'Cross-cutting themes, e.g. "vancouver-style", "housing", "mentorship".' }
  review: { enum: [draft, approved, public, restricted], description: 'draft → approved by interviewee → public. restricted never publishes.' }
  notes: { type: string }
