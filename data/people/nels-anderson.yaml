  Lead designer of Klei's Mark of the Ninja (2012) and a speaker at the 2013 and 2016 Full Indie Summits.
bio: >-
  Anderson was lead designer of Mark of the Ninja, which Klei released on Xbox Live Arcade on September
  7, 2012. He spoke at the first Full Indie Summit on April 20, 2013, and again at the 2016 Summit, by
  then as a Firewatch developer.
