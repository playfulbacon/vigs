summary: Relic Entertainment founding member who co-founded Blackbird Interactive in 2007.
bio: >-
  Cunningham was one of Relic Entertainment's founders in May 1997. In 2007 he and fellow Relic founder
  Aaron Kambeitz, with other ex-Relic and ex-EA staff, founded Blackbird Interactive, where Wikipedia
  lists him as CEO.
