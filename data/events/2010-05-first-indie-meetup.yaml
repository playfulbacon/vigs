summary: Jake Birkett and Alex Vostrov (Rocket Bear Games, formerly Indiebird) hold the first Vancouver Indie Game
  Developers meetup at Soho Cafe and Billiards in Yaletown, with 40+ attendees from a group of 60+ members. The
  meetup becomes Full Indie.
