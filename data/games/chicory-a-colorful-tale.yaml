vancouver_connection: Made by Greg Lobanov in Vancouver, with audio by Vancouver's A Shell in the Pit; Lobanov calls it his biggest success.
region: vancouver
summary: Greg Lobanov's painting adventure game, Kickstarted as Drawdog in August 2019 and released by Finji on June 10, 2021, with lead art by Alexis Dean-Jones and Madeline Berger and music by Lena Raine. It won a BAFTA in the Family category.
