vancouver_connection: Made while the Northways were travelling, before they settled in Vancouver in 2014; it is part of their story but not a Vancouver-made game.
summary: A creature-building physics puzzle game designed by Colin and Sarah Northway with art by Thomas Shahan, released October 25, 2012. It was a 2013 IGF finalist and was developed while the couple visited numerous countries.
