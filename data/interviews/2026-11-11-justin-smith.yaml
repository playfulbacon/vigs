summary: >-
  First VIGS interview. Justin Smith, who some credit with starting the Vancouver indie scene (he says it
  was "a combination of factors"), describes leaving AAA work at BioWare and Digital Extremes for
  Vancouver in 2007, making TIGSource competition games on the side, and porting Chevy Ray Johnston's
  Skullpogo to iPhone in 2009, which brought Chevy from Kamloops to Vancouver; Chevy in turn brought Maddy
  Thorson, the start of the line to Indie House. He recalls the first indie meetup in May 2010, the
  contrast with AAA party culture, the Orca Jam trips to Victoria, and a "golden era" from 2007 to Covid
  that ended as people found success, got older and stopped jamming. He offers more games for the
  timeline and names people to talk to next.
