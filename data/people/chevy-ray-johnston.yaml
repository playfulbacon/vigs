summary: >-
  FlashPunk creator who drew Maddy Thorson and Noel Berry to Vancouver and proposed Indie House; lead
  developer of Ikenfell (2020, Happy Ray Games).
bio: >-
  Johnston grew up making free games in the Game Maker community, where Johnston met Maddy Thorson at
  about 16, and later on TIGSource, and made FlashPunk, the free ActionScript library, whose most active
  helper was Noel Berry. After Justin Smith cold-emailed about an iPhone Skullpogo, Johnston came to
  Vancouver to build the port with Smith in his kitchen, went to the indie meetup, and moved to the city,
  rooming with Smith for about four months. After about a year here Johnston kept inviting Thorson and
  Berry, both in the Prairies, to visit until they moved, and proposed the shared house. Johnston also
  introduced Pedro Medeiros and Amora Bettany to Thorson for TowerFall, and taught at Vancouver Film School
  before indie work paid. Johnston shared a Vancouver apartment with Maddy Thorson after her college years and suggested getting
  the house near Steveston that became Indie House, which the two took around October 2012. At the June
  2012 Full Indie Game Jam, Johnston and Noel Berry met Kevin Regamey of Power Up Audio. Johnston was
  lead developer, artist and writer of Ikenfell, released by Happy Ray Games with Humble Games on October
  8, 2020; the Georgia Straight says it came out of Indie House.
