$schema: https://json-schema.org/draft/2020-12/schema
$id: common.yaml
title: Shared definitions
$defs:
  id:
    description: Stable slug ID. Must match the file name (without .yaml).
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'

  ids:
    type: array
    items: { $ref: '#/$defs/id' }
    uniqueItems: true

  date:
    description: >
      A fuzzy date. Either a plain string — "1982", "2012-06", "2012-06-17",
      or a decade like "1990s" — or an object with extra detail.
    oneOf:
      - $ref: '#/$defs/dateString'
      - type: object
        additionalProperties: false
        required: [value]
        properties:
          value: { $ref: '#/$defs/dateString' }
          approximate: { type: boolean, description: 'True for "c.", "around", "late 2016".' }
          qualifier: { enum: [early, mid, late, before, after, by] }
          display: { type: string, description: Human-readable override, e.g. "late 2016". }
          note: { type: string }

  dateString:
    type: string
    pattern: '^(\d{4}(-\d{2}(-\d{2})?)?|\d{3}0s)$'

  status:
    description: >
      Confidence in a record. verified = checked against an opened primary or press
      source; single-source = one secondary source or a snippet; disputed = sources
      disagree (see accounts); unverified = not yet checked; interview-only = rests
      only on oral testimony.
    enum: [verified, single-source, disputed, unverified, interview-only]

  citation:
    description: A source ID, or an object pointing at a source with detail.
    oneOf:
      - $ref: '#/$defs/id'
      - type: object
        additionalProperties: false
        required: [source]
        properties:
          source: { $ref: '#/$defs/id' }
          note: { type: string }
          quote: { type: string, description: Short verbatim excerpt supporting the claim. }
          locator: { type: string, description: 'Page, section, or timestamp ("00:14:32").' }

  citations:
    type: array
    items: { $ref: '#/$defs/citation' }

  account:
    description: One side of a disputed fact.
    type: object
    additionalProperties: false
    required: [summary]
    properties:
      summary: { type: string }
      sources: { $ref: '#/$defs/citations' }
      claims: { $ref: '#/$defs/ids' }

  image:
    type: object
    additionalProperties: false
    properties:
      file: { type: string, description: 'Path under media/, e.g. media/games/celeste.jpg' }
      source_url: { type: string, format: uri }
      credit: { type: string }
      license: { type: string, description: 'e.g. "CC BY-SA 4.0", "press kit", "used with permission", "unknown"' }
      permission: { enum: [unknown, public-license, press-kit, granted, requested, declined] }

  links:
    type: object
    description: Named external links (website, wikipedia, steam, itch, mobygames, bluesky, mastodon, twitter, youtube, kickstarter, ...).
    additionalProperties: { type: string, format: uri }

  region:
    enum: [vancouver, lower-mainland, victoria, vancouver-island, bc, canada, international]
